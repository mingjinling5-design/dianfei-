<!doctype html><html lang="zh-CN"><head><script src="/site.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>易校园登录 · 寝室电费</title>
<style>
:root{color-scheme:light;--ink:#172437;--muted:#66758a;--line:#dce4ee;--blue:#2563eb;--pale:#eff5ff;--surface:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6fb;color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100% - 32px,480px);margin:clamp(28px,8vh,76px) auto;padding:32px;background:var(--surface);border:1px solid #e5eaf1;border-radius:20px;box-shadow:0 18px 50px rgba(24,43,73,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--pale);color:var(--blue);font-size:20px;font-weight:750}.brand h1{font-size:21px;line-height:1.2;margin:0;letter-spacing:.01em}.brand p{color:var(--muted);font-size:13px;margin:4px 0 0}
#status{margin:0 0 22px;padding:10px 12px;background:#f7f9fc;border:1px solid #edf1f6;border-radius:10px;color:var(--muted);font-size:13px}
section{padding:0;border:0;background:transparent;border-radius:0}h2{font-size:16px;margin:0 0 20px;font-weight:650}label{display:block;font-size:13px;color:#46566c;margin:16px 0 7px}
input,select,button{font:inherit}input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);outline:none;transition:border-color .16s,box-shadow .16s}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}input::placeholder{color:#98a5b6}
button{min-height:44px;padding:10px 15px;border:0;border-radius:10px;background:var(--blue);color:white;font-weight:600;cursor:pointer;transition:background .16s,transform .16s}button:hover:not(:disabled){background:#1d4ed8}button:active:not(:disabled){transform:translateY(1px)}button.secondary{background:#edf3ff;color:var(--blue)}button.secondary:hover:not(:disabled){background:#dfeaff}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}#captchaImage{max-width:100%;max-height:100px;margin-top:12px;border:1px solid var(--line);border-radius:8px}#message{min-height:0;margin:16px 0 0;padding:0;color:var(--muted);font-size:13px;white-space:pre-wrap}#message:empty{display:none}.error{color:#b42318!important}
@media(max-width:520px){main{width:min(100% - 24px,480px);margin:18px auto;padding:24px 20px;border-radius:16px}.brand{margin-bottom:18px}#status{margin-bottom:18px}}
</style></head>
<body><main><header class="brand"><div class="brand-mark" aria-hidden="true">电</div><div><h1>寝室电费</h1><p>登录易校园账号，查询宿舍电费</p></div></header><p id="status">正在读取登录状态…</p>
<div class="grid"><section><h2>易校园账号验证</h2><label for="phone">易校园手机号</label><input id="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="11" placeholder="输入已绑定校园身份的手机号"><label for="school">学校代码</label><input id="school" inputmode="numeric" value="10356"><button id="prepare" type="button">获取图片验证码</button><img id="captchaImage" alt="易校园图片验证码"><label for="captcha">图片验证码</label><input id="captcha" autocomplete="off" placeholder="按上方图片输入"><button id="send" type="button">发送短信验证码</button><label for="code">短信验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"><button id="login" type="button">登录并授权</button><button id="authorize" type="button" class="secondary">重新授权电费会话</button></section>
<!-- Dormitory is detected from the authenticated account's upstream binding. -->
<p id="message" role="status" aria-live="polite"></p></main>
<script>
const el=id=>document.getElementById(id);let busy=false;let smsUntil=0;
function message(text,error=false){el('message').textContent=text;el('message').classList.toggle('error',error)}
function smsButton(){const left=Math.max(0,Math.ceil((smsUntil-Date.now())/1000));el('send').textContent=left?`请等待 ${left} 秒`:'发送短信验证码';el('send').disabled=busy||left>0}
async function api(action,body={}){const res=await fetch('/api/eschool/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Eschool-Request':'1'},body:JSON.stringify(body)});const data=await res.json();if(!data.ok)throw Error(data.error||'操作失败');return data}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message(e.message,true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);smsButton();await status()}}
async function status(){try{const s=await fetch('/api/eschool/status').then(r=>r.json());if(!s.ok)throw Error(s.error);el('status').textContent=s.logged_in?`App 已登录 ${s.phone} · ${s.school_name||s.school_code} · ${s.authorized?'电费会话已建立':'电费会话待授权'}`:'当前尚未登录易校园，请完成短信验证。';if(s.school_code)el('school').value=s.school_code;return s}catch(e){message('状态读取失败：'+e.message,true)}}
async function autoRoom(){message('正在通过易校园接口识别宿舍…');const s=await api('auto-room');if(!s.restored)throw Error(s.message||'未能从易校园账号识别到宿舍');message(s.message)}
el('prepare').onclick=()=>run(async()=>{message('正在获取图片验证码…');const s=await api('captcha',{phone:el('phone').value.trim(),school_code:el('school').value.trim()});el('captchaImage').src=s.image;el('captchaImage').style.display='block';el('captcha').value='';message('请填写图片验证码，再发送短信。')});
el('send').onclick=()=>run(async()=>{const s=await api('send-code',{captcha:el('captcha').value.trim()});smsUntil=Date.now()+60000;message(s.message)});
el('login').onclick=()=>run(async()=>{message('正在登录并授权…');const s=await api('login',{code:el('code').value.trim()});el('code').value='';message(s.message);await autoRoom();message('正在采集电费…');const r=await fetch('/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json());if(!r.ok)throw Error(r.error||r.results?.find(x=>!x.ok)?.error||'首次电费采集失败');message('采集成功，正在打开仪表盘…');location.replace('/')});
el('authorize').onclick=()=>run(async()=>{message((await api('authorize')).message);await autoRoom()});
setInterval(smsButton,1000);status().then(s=>{if(s?.logged_in&&s.authorized)run(async()=>{await autoRoom();location.replace('/')})});
</script></body></html>
